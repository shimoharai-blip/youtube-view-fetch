name: Fetch YouTube Raw Data

on:
  schedule:
    - cron: "51 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-api-python-client pandas

      - name: Run fetch.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch.py

      - name: Commit raw CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add view_history_hourly_raw.csv
          git commit -m "Update raw CSV"
          git push
