name: youtube-view-fetch

on:
  schedule:
    - cron: "15 * * * *"   # JST00分に最も近い
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-api-python-client
          pip install pandas

      - name: Run fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch.py

      - name: Upload CSV
        uses: actions/upload-artifact@v3
        with:
          name: csv
          path: view_history_hourly.csv

  commit:
    needs: fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: false   # ← これがないと CSV が消えて commit が動かない

      - name: Download CSV
        uses: actions/download-artifact@v3
        with:
          name: csv

      - name: Commit CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add view_history_hourly.csv
          git commit -m "Update CSV" || echo "No changes"
          git push
