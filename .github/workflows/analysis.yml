name: Analyze YouTube Data

on:
  workflow_run:
    workflows: ["Fetch YouTube Raw Data"]
    types:
      - completed
  workflow_dispatch:

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - name: Install Japanese font
        run: sudo apt-get install -y fonts-ipafont-gothic

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib tabulate

      - name: Run analysis.py
        run: |
          python analysis.py

      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update processed CSV and analysis report"
          git push
