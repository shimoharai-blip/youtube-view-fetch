name: Analyze YouTube Data

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # ★ 最新 HEAD を確実に取得
          ref: ${{ github.sha }}

      - name: Install Japanese font
        run: sudo apt-get install -y fonts-ipafont-gothic

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib tabulate

      - name: Run analysis.py
        run: python analysis.py

      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add view_history_hourly_processed.csv analysis_report.md graph_*.png
          git commit -m "Update processed CSV and analysis report"
          git push
